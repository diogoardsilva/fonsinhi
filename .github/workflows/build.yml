name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o AlbumICloud.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle assembleDebug --no-daemon
        working-directory: AlbumICloud
      - run: cp AlbumICloud/app/build/outputs/apk/debug/app-debug.apk AlbumICloud.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Álbum iCloud ${{ github.run_number }}
          files: AlbumICloud.apk
